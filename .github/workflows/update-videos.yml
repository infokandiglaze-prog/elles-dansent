name: Mettre à jour les vidéos YouTube

on:
  schedule:
    - cron: '17 9 * * *'   # chaque jour (~4h17, heure de Montréal)
  workflow_dispatch:        # bouton « Run workflow » pour lancer à la main
  push:
    paths:
      - 'data/profs.json'   # relance dès qu'une prof est ajoutée

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les vidéos
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/fetch-videos.mjs
      - name: Enregistrer si changement
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/videos.json
          git diff --cached --quiet || (git commit -m "Mise à jour des vidéos YouTube" && git push)
