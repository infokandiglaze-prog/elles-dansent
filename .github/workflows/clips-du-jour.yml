name: Clips du jour

on:
  schedule:
    - cron: '11 11 * * *'   # chaque jour (~5h41, heure de Montréal)
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: maj-donnees
  cancel-in-progress: false

jobs:
  clips:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Chercher les nouveaux clips
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: node scripts/clips-du-jour.mjs
      - name: Enregistrer
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/clips.json
          git diff --cached --quiet || (git commit -m "Clips du jour" && git pull --rebase && git push)
      - name: Chaînes à valider
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -s rapport-clips.md ]; then
            gh issue create --title "Clips : nouvelles chaînes à valider — $(date +%Y-%m-%d)" --body-file rapport-clips.md
          fi
