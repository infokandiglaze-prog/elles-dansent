<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Chill TV — Maintenance</title>
<meta name="theme-color" content="#07050A">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    background: #07050A;
    color: #fff;
    font-family: Inter, system-ui, sans-serif;
    text-align: center;
  }
  main { max-width: 720px; width: 100%; }
  p.badge {
    display: inline-block;
    margin: 0 0 18px;
    padding: 7px 14px;
    border-radius: 999px;
    background: linear-gradient(135deg, #FF2E7E, #FF4D3D);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .12em;
    text-transform: uppercase;
  }
  h1 { margin: 0 0 12px; font-size: clamp(32px, 6vw, 48px); letter-spacing: -.03em; }
  p { margin: 0; color: rgba(255,255,255,.72); font-size: 17px; line-height: 1.5; }
  .player {
    margin-top: 28px;
    position: relative;
    width: 100%;
    aspect-ratio: 16/9;
    border-radius: 16px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(255,255,255,.08);
  }
  .player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
</style>
</head>
<body>
<main>
  <p class="badge">Maintenance</p>
  <h1>Chill TV</h1>
  <p>Le site est temporairement indisponible. Merci de revenir plus tard.</p>
  <div class="player">
    <iframe src="https://www.pornhub.com/embed/68bd8eedd39fd" title="Vidéo" frameborder="0" scrolling="no" allowfullscreen></iframe>
  </div>
</main>
</body>
</html>
