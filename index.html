<!doctype html>
<html lang="fr">
<head>
<meta name="babek-reserve" content="membres">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chill TV — clips dancehall, soca et rap en continu</title>
<meta name="description" content="Chill TV : les clips dancehall, soca et rap en continu, comme une chaîne de télé.">
<meta name="theme-color" content="#07050A">
<link rel="icon" href="media/logo.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=6">
<script src="agegate.js"></script>
<style>
  .tv{padding:28px 0 60px}
  .tv-tete{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .tv-tete h1{font-weight:800;font-size:clamp(28px,4vw,48px);letter-spacing:-.02em}
  .live{display:inline-flex;align-items:center;gap:8px;background:#FF2E7E;color:#fff;font:700 13px/1 Inter,sans-serif;padding:7px 12px;border-radius:999px;letter-spacing:.08em}
  .live::before{content:"";width:8px;height:8px;border-radius:50%;background:#fff;animation:clignote 1.2s infinite}
  @keyframes clignote{50%{opacity:.2}}
  .ecran{position:relative;width:100%;aspect-ratio:16/9;background:#000;border-radius:18px;overflow:hidden;box-shadow:0 30px 80px -30px rgba(255,46,126,.45)}
  .ecran #lecteur,.ecran iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .son{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:2;font:700 18px Inter,sans-serif;color:#fff;background:linear-gradient(135deg,#FF2E7E,#FF4D3D);border:0;border-radius:999px;padding:16px 26px;cursor:pointer}
  .barre{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:14px}
  .en-cours{font-weight:600}
  .en-cours small{display:block;opacity:.65;font-weight:400}
  .tv-btns{display:flex;gap:10px}
  .styles{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 16px}
  .style{cursor:pointer;font:600 14px/1 Inter,sans-serif;color:#cfc6d6;background:transparent;border:1px solid rgba(255,255,255,.18);border-radius:999px;padding:10px 16px;transition:all .2s}
  .style:hover{border-color:#FF2E7E;color:#fff}
  .style[aria-pressed="true"]{color:#fff;border-color:transparent;background:linear-gradient(135deg,#FF2E7E,#FF4D3D);box-shadow:0 8px 24px -8px rgba(255,46,126,.7)}
  .style small{opacity:.7;font-weight:500;margin-left:4px}
</style>
</head>
<body>
<a class="skip" href="#contenu">Aller au contenu</a>

<header class="nav scrolled" id="nav">
  <div class="wrap nav-in">
    <a href="./" class="logo" aria-label="Chill TV, accueil">
      <span>Chill TV</span>
    </a>
    <button class="burger" id="burger" type="button" aria-label="Ouvrir le menu" aria-expanded="false" aria-controls="menu">
      <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <nav id="menu" aria-label="Navigation principale">
        <a href="./" aria-current="page" class="nav-hot">TV</a>
        <a href="clips.html">Clips</a>
      </nav>
  </div>
</header>

<main id="contenu">
  <section class="wrap tv">
    <div class="tv-tete"><span class="live">EN DIRECT</span><h1>Chill TV</h1></div>
    <div class="styles" id="styles" role="group" aria-label="Choisir les styles de clips"></div>
    <div class="ecran">
      <div id="lecteur"></div>
      <button class="son" id="son" type="button">🔊 Activer le son</button>
    </div>
    <div class="barre">
      <div class="en-cours" id="en-cours">Chargement de la chaîne…</div>
      <div class="tv-btns">
        <button class="btn" id="suivant" type="button">Clip suivant ⏭</button>
        <button class="btn btn-or" id="plein" type="button">Plein écran</button>
      </div>
    </div>
  </section>
</main>


<footer class="foot">
  <div class="wrap foot-bas">
    <span>© <span id="annee"></span> Chill TV</span>
    <a href="clips.html">Tous les clips</a>
    
    </div>
<div class="wrap socials" aria-label="La musique"><span>La musique</span><a href="https://infokandiglaze-prog.github.io/babe-killa-music/">Chill TV x Lollipop Queen</a></div>
</footer>
<script>
  document.getElementById('annee').textContent = new Date().getFullYear();
  const burger = document.getElementById('burger'), menu = document.getElementById('menu');
  if (burger && menu) burger.addEventListener('click', () => { const o = menu.classList.toggle('ouvert'); burger.setAttribute('aria-expanded', o); });
  const DANCEHALL = ["UCnDtPtBzMHlcV_4ury2ifqA"];
  let tout = [], liste = [], i = 0, lecteur = null, sonActif = false, choix = new Set(), chaud = false, genreDe = {};
  const melanger = (a) => { for (let k = a.length - 1; k > 0; k--) { const j = Math.floor(Math.random() * (k + 1)); [a[k], a[j]] = [a[j], a[k]]; } return a; };
  const afficher = (v) => { const e = document.getElementById('en-cours'); e.textContent = v.titre; const s = document.createElement('small'); s.textContent = v.chaine + ' · ' + v.genre + (v.vues ? ' · ' + v.vues.toLocaleString('fr-CA') + ' vues' : ''); e.appendChild(s); };
  const jouer = () => { if (!liste.length || !lecteur) return; const v = liste[i % liste.length]; afficher(v); lecteur.loadVideoById(v.id); if (!sonActif) lecteur.mute(); };
  const suivant = () => { i++; if (i >= liste.length) { i = 0; if (!chaud) melanger(liste); } jouer(); };
  // Construit la liste à lire selon les styles cochés (plusieurs possibles) et le mode « chaud »
  const construire = (relancer) => {
    let l = tout.filter((v) => !choix.size || choix.has(v.genre));
    if (chaud) l = [...l].sort((a, b) => (b.vues || 0) - (a.vues || 0)).slice(0, 40);
    else melanger(l);
    liste = l; i = 0;
    if (relancer) jouer();
  };
  const puces = () => {
    const cnt = {}; tout.forEach((v) => { cnt[v.genre] = (cnt[v.genre] || 0) + 1; });
    const ordre = Object.keys(cnt).sort((a, b) => cnt[b] - cnt[a]);
    const box = document.getElementById('styles');
    box.innerHTML = [`<button type="button" class="style" data-g="__tous" aria-pressed="${!choix.size && !chaud}">Tous</button>`,
      `<button type="button" class="style" data-g="__chaud" aria-pressed="${chaud}">🔥 Les plus chauds</button>`,
      ...ordre.map((g) => `<button type="button" class="style" data-g="${g.replace(/"/g, '&quot;')}" aria-pressed="${choix.has(g)}">${g}<small>${cnt[g]}</small></button>`)].join('');
    box.querySelectorAll('.style').forEach((b) => b.addEventListener('click', () => {
      const g = b.dataset.g;
      if (g === '__tous') { choix.clear(); chaud = false; }
      else if (g === '__chaud') chaud = !chaud;
      else if (choix.has(g)) choix.delete(g); else choix.add(g);
      puces(); construire(true);
    }));
  };
  Promise.all([
    fetch('data/clips.json', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ videos: [] })),
    fetch('data/twerk.json', { cache: 'no-store' }).then((r) => r.json()).catch(() => ({ videos: [] })),
    fetch('data/clips-chaines.json', { cache: 'no-store' }).then((r) => r.json()).catch(() => [])
  ]).then(([c, t, ch]) => {
    ch.forEach((x) => { if (x && x.genre) genreDe[x.id] = x.genre; });
    DANCEHALL.forEach((id) => { genreDe[id] = genreDe[id] || 'Dancehall'; });
    const vus = new Set();
    tout = [...(c.videos || []), ...(t.videos || []).filter((v) => DANCEHALL.includes(v.chaineId))]
      .filter((v) => v.id && !vus.has(v.id) && vus.add(v.id))
      .map((v) => ({ ...v, genre: genreDe[v.chaineId] || 'Autres' }));
    puces(); construire(false);
    const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s);
  });
  window.onYouTubeIframeAPIReady = () => {
    lecteur = new YT.Player('lecteur', {
      host: 'https://www.youtube-nocookie.com',
      playerVars: { autoplay: 1, mute: 1, playsinline: 1, rel: 0, modestbranding: 1 },
      events: {
        onReady: () => jouer(),
        onStateChange: (e) => { if (e.data === YT.PlayerState.ENDED) suivant(); },
        onError: () => suivant()
      }
    });
  };
  document.getElementById('son').addEventListener('click', (e) => { sonActif = true; if (lecteur) { lecteur.unMute(); lecteur.setVolume(100); lecteur.playVideo(); } e.currentTarget.remove(); });
  document.getElementById('suivant').addEventListener('click', suivant);
  document.getElementById('plein').addEventListener('click', () => { const el = document.querySelector('.ecran'); (el.requestFullscreen || el.webkitRequestFullscreen || (() => {})).call(el); });
</script>
<script src="auth-config.js?v=2"></script>
<script type="module" src="membre.js?v=3"></script>
</body>
</html>
